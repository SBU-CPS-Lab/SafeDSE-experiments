patterns:
- id: none
  source:
  - baseline
  description: 'No structural pattern.  The required integrity is met by development
    process alone.  IEC 61508 treats this as adequate at the lower integrity levels
    only.  The ceiling is SIL 1, per IEC 61508: from SIL 2 upward the standard expects
    diagnostic coverage, so a SIL-2 actor must take at least a checker pattern and
    cannot be discharged by process alone. This ceiling is the single most consequential
    number in the library -- move it and the whole design space moves with it -- which
    is exactly why it lives in the data where it can be argued with, not in the solver.

    '
  components: []
  edges: []
  placement: []
  achieves_sil:
  - 0
  - 1
  covers_faults:
  - random_hw
  - systematic_sw
  failure_mode: none
  voter: folded
  recurring_cost_units: 0
  scenarios: []
  tactics: []
  sdf_compatible: true
- id: low_sil_doer_checker
  source:
  - koopman
  - Low SIL Doer/Checker Pair (E-quizzer)
  description: 'A low-SIL doer on one CPU, checked by a higher-SIL checker on a SEPARATE
    CPU.  The checker quizzes the doer and can shut the channel down, so the pair
    fails active at SIL 1-2.  Separation is what makes it tolerate a random hardware
    fault in the doer''s processor.

    '
  components:
  - role: checker
    sil_offset: 1
    wcet_type: checker_<owner>
  edges:
  - from: owner
    to: checker
    tokens: 0
  - from: checker
    to: owner
    tokens: 1
  input_fanout:
  - checker
  output_from: owner
  placement:
  - relation: DIFFERENT
    members:
    - owner
    - checker
    for: random_hw
  achieves_sil:
  - 1
  - 2
  covers_faults:
  - random_hw
  failure_mode: active
  voter: folded
  dev_cost_multiplier:
    checker: 1.0
  recurring_cost_units: 2
  scenarios:
  - id: SC1
    text: 'An implausible output of the doer is detected by the checker.

      '
    tactics:
    - Sanity Check
  - id: SC2
    text: 'A random hardware fault in the doer''s processor does not prevent detection,
      because the checker runs on another processor.

      '
    covers: random_hw
    tactics:
    - Replication Redundancy
  tactics:
  - Sanity Check
  - Replication Redundancy
  sdf_compatible: true
- id: two_of_two_high_sil
  source:
  - koopman
  - Two Channel (2-of-2)
  description: 'Two channels, both at high SIL, compute the same function and must
    agree. Channel b receives the owner''s result, compares it with its own, and returns
    the verdict to the owner over an edge with one initial token; on a disagreement
    the owner marks its output invalid and the pair goes to its safe state (fails
    silent), so the fault reaction starts within one iteration.  No explicit voter:
    2-of-2 requires agreement rather than a majority, so the comparison folds into
    channel b and the owner, and no explicit voter is needed.  The name is Koopman''s;
    it is not IEC 61508 MooN notation. Both channels always fire and always produce,
    per the token-preservation obligation.  A detected disagreement marks the token
    invalid; it never withholds it.  So the timing guarantee holds in the degraded
    mode too, at the price of being conservative in the fault-free case.

    '
  components:
  - role: channel_b
    sil_offset: 0
    wcet_type: <owner>
  edges:
  - from: owner
    to: channel_b
    tokens: 0
  - from: channel_b
    to: owner
    tokens: 1
  input_fanout:
  - channel_b
  output_from: owner
  placement:
  - relation: DIFFERENT_FCR
    members:
    - owner
    - channel_b
    for: random_hw
  - relation: DIVERSE
    members:
    - owner
    - channel_b
    for: systematic_sw
  achieves_sil:
  - 3
  - 4
  covers_faults:
  - random_hw
  - systematic_sw
  failure_mode: silent
  voter: folded
  dev_cost_multiplier:
    channel_b: 1.0
  dev_cost_multiplier_diverse:
    channel_b: 2.0
  recurring_cost_units: 2
  scenarios:
  - id: SC1
    text: 'A fault in either channel is detected as a disagreement between the two
      channels.

      '
    tactics:
    - Comparison
  - id: SC2
    text: 'A random hardware fault in one channel does not affect the other channel.

      '
    covers: random_hw
    tactics:
    - Replication Redundancy
  - id: SC3
    text: 'A systematic fault is not common to both channels.

      '
    covers: systematic_sw
    tactics:
    - Diverse Redundancy
  - id: SC4
    text: 'A detected disagreement does not propagate an incorrect result to the consumer.

      '
    tactics:
    - Voting
  tactics:
  - Replication Redundancy
  - Comparison
  - Voting
  - Diverse Redundancy
  sdf_compatible: true
- id: high_sil_isolated_checker
  source:
  - koopman
  - High SIL Doer/Checker with isolated checker
  description: 'A high-SIL doer with an equally high-SIL checker on a separate processor.
    Distinct from the SIL 1-2 Doer/Checker family in that both sides are developed
    to the high level, and from 2-of-2 in that the checker verifies rather than recomputes
    -- so its WCET is a fraction of the doer''s, which is what makes it competitive
    on throughput. Koopman''s "Attempted High SIL Doer/Checker" is the same structure
    WITHOUT the isolation, and is an anti-pattern; the catalogue check rejects any
    record that claims to fail silent while co-locating its channels.

    '
  components:
  - role: checker
    sil_offset: 0
    wcet_type: checker_<owner>
  edges:
  - from: owner
    to: checker
    tokens: 0
  - from: checker
    to: owner
    tokens: 1
  input_fanout:
  - checker
  output_from: owner
  placement:
  - relation: DIFFERENT_FCR
    members:
    - owner
    - checker
    for: random_hw
  achieves_sil:
  - 3
  covers_faults:
  - random_hw
  failure_mode: silent
  voter: folded
  dev_cost_multiplier:
    checker: 1.0
  recurring_cost_units: 2
  scenarios:
  - id: SC1
    text: 'An implausible output of the doer is detected by the equally-high-SIL checker.

      '
    tactics:
    - Sanity Check
  - id: SC2
    text: 'A random hardware fault in the doer''s fault containment region does not
      disable the checker.

      '
    covers: random_hw
    tactics:
    - Replication Redundancy
  tactics:
  - Sanity Check
  - Replication Redundancy
  sdf_compatible: true
- id: mixed_sil_doer_checker
  source:
  - koopman
  - Mixed SIL Doer/Checker
  - armoush
  - HmD
  description: 'A LOW-SIL doer checked by a 2-of-2 pair of high-SIL checkers.  The
    point is economic: the expensive-to-develop part is the small checker, not the
    large doer, so a SIL 3-4 function is obtained while the bulk of the code stays
    at SIL 1-2.  Three processors. Represented FLAT (no nesting): the "checker for
    the checker" is simply a second checker component with a cross-check edge, not
    a recursive application of another pattern.

    '
  components:
  - role: checker_1
    sil_offset: 2
    wcet_type: checker_<owner>
  - role: checker_2
    sil_offset: 2
    wcet_type: checker_<owner>
  edges:
  - from: owner
    to: checker_1
    tokens: 0
  - from: owner
    to: checker_2
    tokens: 0
  - from: checker_1
    to: checker_2
    tokens: 1
  - from: checker_2
    to: checker_1
    tokens: 1
  - from: checker_1
    to: owner
    tokens: 1
  input_fanout:
  - checker_1
  - checker_2
  output_from: owner
  placement:
  - relation: DIFFERENT_FCR
    members:
    - owner
    - checker_1
    for: random_hw
  - relation: DIFFERENT_FCR
    members:
    - checker_1
    - checker_2
    for: random_hw
  - relation: DIVERSE
    members:
    - checker_1
    - checker_2
    for: systematic_sw
  achieves_sil:
  - 3
  - 4
  covers_faults:
  - random_hw
  - systematic_sw
  failure_mode: silent
  voter: folded
  dev_cost_multiplier:
    checker_1: 1.0
    checker_2: 1.0
  recurring_cost_units: 3
  scenarios:
  - id: SC1
    text: 'An implausible output of the low-SIL doer is detected by the high-SIL checkers.

      '
    tactics:
    - Sanity Check
  - id: SC2
    text: 'A fault in one checker is detected by the other checker''s cross-check.

      '
    tactics:
    - Comparison
  - id: SC3
    text: 'A random hardware fault affects at most one of the doer and the two checkers.

      '
    covers: random_hw
    tactics:
    - Replication Redundancy
  - id: SC4
    text: 'A systematic fault in one checker is not reproduced by the other checker.

      '
    covers: systematic_sw
    tactics:
    - Diverse Redundancy
  - id: SC5
    text: 'A detected disagreement does not propagate an incorrect result to the consumer.

      '
    tactics:
    - Voting
  tactics:
  - Sanity Check
  - Comparison
  - Replication Redundancy
  - Voting
  - Diverse Redundancy
  sdf_compatible: true
- id: same_cpu_doer_checker
  source:
  - koopman
  - Same-CPU Doer/Checker
  description: 'Structurally IDENTICAL to low_sil_doer_checker.  The only difference
    is that the checker shares the doer''s processor.  Cheaper -- one CPU instead
    of two -- but it tolerates no hardware fault in that processor, and under Koopman''s
    rule 2 the shared core is provisioned to the checker''s SIL, so the doer is promoted
    unless certified partitioning is available. It covers systematic faults only through
    the checker''s different algorithm, a value-domain property that no placement
    establishes; the other patterns that cover them do so through DIVERSE core types.
    This record exists to demonstrate that a pattern is a graph rewrite PLUS a placement
    relation; drop the placement field and the two patterns become indistinguishable.

    '
  components:
  - role: checker
    sil_offset: 1
    wcet_type: checker_<owner>
  edges:
  - from: owner
    to: checker
    tokens: 0
  - from: checker
    to: owner
    tokens: 1
  input_fanout:
  - checker
  output_from: owner
  placement:
  - relation: SAME
    members:
    - owner
    - checker
  achieves_sil:
  - 1
  - 2
  covers_faults:
  - systematic_sw
  failure_mode: active
  voter: folded
  dev_cost_multiplier:
    checker: 1.0
  recurring_cost_units: 1
  scenarios:
  - id: SC1
    text: 'An implausible output of the doer is detected by the checker.

      '
    tactics:
    - Sanity Check
  tactics:
  - Sanity Check
  sdf_compatible: true
- id: dual_two_of_two
  source:
  - koopman
  - Dual 2-of-2
  description: 'Two independent 2-of-2 pairs, four processors.  One pair fails silent
    and the other continues, so the function as a whole is fail-OPERATIONAL -- the
    distinction Koopman insists on: cross-checked redundancy detects faults, standby
    redundancy provides availability, and you must not spend one and claim the other.
    The hot standby runs concurrently but does not place data on the output queue
    until the primary pair is signalled failed.  Under the token-preservation obligation
    all four channels always fire and always produce; the selection is a value-domain
    operation.  So the timing guarantee holds in the degraded mode too.

    '
  components:
  - role: primary_b
    sil_offset: 0
    wcet_type: <owner>
  - role: standby_a
    sil_offset: 0
    wcet_type: <owner>
  - role: standby_b
    sil_offset: 0
    wcet_type: <owner>
  edges:
  - from: owner
    to: primary_b
    tokens: 0
  - from: primary_b
    to: owner
    tokens: 1
  - from: standby_a
    to: standby_b
    tokens: 0
  - from: standby_b
    to: standby_a
    tokens: 1
  - from: standby_a
    to: owner
    tokens: 1
  input_fanout:
  - primary_b
  - standby_a
  - standby_b
  output_from: owner
  placement:
  - relation: DIFFERENT_FCR
    members:
    - owner
    - primary_b
    for: random_hw
  - relation: DIFFERENT_FCR
    members:
    - standby_a
    - standby_b
    for: random_hw
  - relation: DIFFERENT_FCR
    members:
    - owner
    - standby_a
    for: random_hw
  achieves_sil:
  - 3
  - 4
  covers_faults:
  - random_hw
  failure_mode: operational
  voter: folded
  dev_cost_multiplier:
    primary_b: 1.0
    standby_a: 1.0
    standby_b: 1.0
  recurring_cost_units: 4
  scenarios:
  - id: SC1
    text: 'A fault in a channel is detected as a disagreement within its pair.

      '
    tactics:
    - Comparison
  - id: SC2
    text: 'A random hardware fault affects at most one of the four channels.

      '
    covers: random_hw
    tactics:
    - Replication Redundancy
  - id: SC3
    text: 'The function remains available after the primary pair has failed silent.

      '
    tactics:
    - Repair
  - id: SC4
    text: 'The failed pair''s result does not reach the consumer once the standby
      pair has taken over.

      '
    tactics:
    - Voting
  tactics:
  - Replication Redundancy
  - Comparison
  - Voting
  - Repair
  sdf_compatible: true
- id: one_of_two_failover
  source:
  - koopman
  - Two-Channel Failover (1-of-2)
  description: 'Two identical channels; if one stops, the other takes over.  This
    buys AVAILABILITY and no integrity: neither channel checks the other, so a channel
    that computes the wrong answer is believed.  Koopman is explicit that this is
    not a safety pattern, and achieves_sil reflects that -- it is admitted so the
    DSE can price availability, not so it can discharge a safety requirement.

    '
  components:
  - role: channel_b
    sil_offset: 0
    wcet_type: <owner>
  edges:
  - from: channel_b
    to: owner
    tokens: 1
  input_fanout:
  - channel_b
  output_from: owner
  placement:
  - relation: DIFFERENT_FCR
    members:
    - owner
    - channel_b
    for: random_hw
  achieves_sil:
  - 0
  - 1
  covers_faults:
  - random_hw
  failure_mode: operational
  voter: folded
  dev_cost_multiplier:
    channel_b: 1.0
  recurring_cost_units: 2
  scenarios:
  - id: SC1
    text: 'The function remains available after one channel stops.

      '
    tactics:
    - Repair
  tactics:
  - Replication Redundancy
  - Repair
  sdf_compatible: true
- id: low_sil_diverse_doer_checker
  source:
  - koopman
  - Low SIL Doer/Checker Pair
  - armoush
  - HtD
  description: 'low_sil_doer_checker with the checker additionally required to be
    a DIVERSE implementation on a different processor type.  Added because the encoded
    Koopman catalogue has a hole: at SIL 2 the separated pair defends against random
    hardware faults and the co-located pair against systematic software faults, but
    nothing covers BOTH.  Separation alone does not help against a systematic fault,
    since an identical checker on another core reproduces the same mistake. The cost
    is Armoush''s heterogeneous-duplex figure: two independent developments, roughly
    200% of one, against ~100% for an identical copy.

    '
  components:
  - role: checker
    sil_offset: 1
    wcet_type: checker_<owner>
  edges:
  - from: owner
    to: checker
    tokens: 0
  - from: checker
    to: owner
    tokens: 1
  input_fanout:
  - checker
  output_from: owner
  placement:
  - relation: DIFFERENT_FCR
    members:
    - owner
    - checker
    for: random_hw
  - relation: DIVERSE
    members:
    - owner
    - checker
    for: systematic_sw
  achieves_sil:
  - 1
  - 2
  covers_faults:
  - random_hw
  - systematic_sw
  failure_mode: active
  voter: folded
  dev_cost_multiplier:
    checker: 2.0
  recurring_cost_units: 2
  scenarios:
  - id: SC1
    text: 'An implausible output of the doer is detected by the checker.

      '
    tactics:
    - Sanity Check
  - id: SC2
    text: 'A random hardware fault in the doer''s fault containment region does not
      prevent detection.

      '
    covers: random_hw
    tactics:
    - Replication Redundancy
  - id: SC3
    text: 'A systematic fault in the doer''s implementation is not reproduced by the
      checker.

      '
    covers: systematic_sw
    tactics:
    - Diverse Redundancy
  tactics:
  - Sanity Check
  - Diverse Redundancy
  - Replication Redundancy
  sdf_compatible: true
