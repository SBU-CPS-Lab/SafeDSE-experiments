# GENERATED by harness.py from data/patterns_explicit_voter_demo.yaml: every edge back to the owner
# with >= 1 token gets 1 more (1 edges).
patterns:
- id: none
  source:
  - baseline
  description: 'No structural pattern.  The required integrity is met by development process alone.  IEC
    61508 treats this as adequate at the lower integrity levels only.  The ceiling is SIL 1, per IEC 61508:
    from SIL 2 upward the standard expects diagnostic coverage, so a SIL-2 actor must take at least a
    checker pattern and cannot be discharged by process alone. This ceiling is the single most consequential
    number in the library -- move it and the whole design space moves with it -- which is exactly why
    it lives in the data where it can be argued with, not in the solver.

    '
  components: []
  edges: []
  placement: []
  achieves_sil:
  - 0
  - 1
  covers_faults:
  - random_hw
  - systematic_sw
  failure_mode: none
  voter: folded
  recurring_cost_units: 0
  scenarios: []
  tactics: []
  sdf_compatible: true
- id: low_sil_diverse_doer_checker
  source:
  - koopman
  - Low SIL Doer/Checker Pair
  - armoush
  - HtD
  description: 'low_sil_doer_checker with the checker additionally required to be a DIVERSE implementation
    on a different processor type.  Added because the encoded Koopman catalogue has a hole: at SIL 2 the
    separated pair defends against random hardware faults and the co-located pair against systematic software
    faults, but nothing covers BOTH.  Separation alone does not help against a systematic fault, since
    an identical checker on another core reproduces the same mistake. The cost is Armoush''s heterogeneous-duplex
    figure: two independent developments, roughly 200% of one, against ~100% for an identical copy.

    '
  components:
  - role: checker
    sil_offset: 1
    wcet_type: checker_<owner>
  edges:
  - from: owner
    to: checker
    tokens: 0
  - from: checker
    to: owner
    tokens: 2
  input_fanout:
  - checker
  output_from: owner
  placement:
  - relation: DIFFERENT_FCR
    members:
    - owner
    - checker
    for: random_hw
  - relation: DIVERSE
    members:
    - owner
    - checker
    for: systematic_sw
  achieves_sil:
  - 1
  - 2
  covers_faults:
  - random_hw
  - systematic_sw
  failure_mode: active
  voter: folded
  dev_cost_multiplier:
    checker: 2.0
  recurring_cost_units: 2
  scenarios:
  - id: SC1
    text: 'An implausible output of the doer is detected by the checker.

      '
    tactics:
    - Sanity Check
  - id: SC2
    text: 'A random hardware fault in the doer''s fault containment region does not prevent detection.

      '
    covers: random_hw
    tactics:
    - Replication Redundancy
  - id: SC3
    text: 'A systematic fault in the doer''s implementation is not reproduced by the checker.

      '
    covers: systematic_sw
    tactics:
    - Diverse Redundancy
  tactics:
  - Sanity Check
  - Diverse Redundancy
  - Replication Redundancy
  sdf_compatible: true
- id: nvp_three_version
  description: 'N-version programming with three independently developed versions and an explicit majority
    voter. The versions compute from the same inputs and the voter selects the majority result, masking
    a fault in any one version.

    '
  source:
  - Armoush 2010
  - IEC 61508-7 C.4.4
  components:
  - role: version_2
    sil_offset: 0
    wcet_type: <owner>
  - role: version_3
    sil_offset: 0
    wcet_type: <owner>
  - role: voter
    sil_offset: 0
    wcet_type: voter_<owner>
  edges:
  - from: owner
    to: voter
    tokens: 0
  - from: version_2
    to: voter
    tokens: 0
  - from: version_3
    to: voter
    tokens: 0
  input_fanout:
  - version_2
  - version_3
  output_from: voter
  voter: explicit
  placement:
  - relation: DIFFERENT_FCR
    members:
    - owner
    - version_2
    - version_3
    for: random_hw
  - relation: DIVERSE
    members:
    - owner
    - version_2
    - version_3
    for: systematic_sw
  - relation: DIFFERENT_FCR
    members:
    - owner
    - voter
    for: random_hw
  achieves_sil:
  - 3
  - 4
  covers_faults:
  - random_hw
  - systematic_sw
  failure_mode: masking
  dev_cost_multiplier:
    version: 1.0
    voter: 0.4
  recurring_cost_units: 4
  scenarios:
  - id: SC1
    text: 'A fault in any single version is masked by the majority of the remaining versions.

      '
    tactics:
    - Voting
  - id: SC2
    text: 'A random hardware fault affects at most one of the three versions.

      '
    covers: random_hw
    tactics:
    - Replication Redundancy
  - id: SC3
    text: 'A systematic fault in one version is not reproduced by the other two versions.

      '
    covers: systematic_sw
    tactics:
    - Diverse Redundancy
  - id: SC4
    text: 'A disagreement among the versions is detected before the result leaves the component.

      '
    tactics:
    - Comparison
  tactics:
  - Replication Redundancy
  - Diverse Redundancy
  - Comparison
  - Voting
  sdf_compatible: true
